name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v0.2.0]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  stage:
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v0.2.0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hysteria2-armada-v0.2.0-release
          path: release
      - name: Verify, attach and publish tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cd ..
          python scripts/package.py release/hysteria2-armada-v0.2.0-arm64.zip
          state="$(gh release view v0.2.0 --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo missing)"
          if [[ "$state" == false ]]; then exit 0; fi
          if [[ "$state" == missing ]]; then gh release create v0.2.0 --draft --prerelease --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"; fi
          gh release upload v0.2.0 release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v0.2.0 --title 'Hysteria2 Armada 0.2.0' --prerelease --notes-file docs/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          gh release edit v0.2.0 --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
