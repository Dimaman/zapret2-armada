name: CI
on:
  push:
    branches: [main, feature/spoofdpi-armada]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend, lifecycle and package checks
        run: |
          npm run typecheck
          npm run build
          python -m compileall -q dpi vpn backend main.py scripts
          python -m unittest tests.test_vpn tests.test_dpi -v
          python scripts/validate-project.py
          bash -n scripts/uninstall.sh
      - run: npm audit --omit=dev --audit-level=high
      - name: Frontend license notices
        run: |
          mkdir -p build/frontend-licenses
          cp node_modules/@decky/api/LICENSE build/frontend-licenses/decky-api-LICENSE
          cp node_modules/tslib/LICENSE.txt build/frontend-licenses/tslib-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            dist/index.js
            build/frontend-licenses
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned ARM64 executables and licenses
        run: |
          python scripts/build_hysteria.py
          python scripts/build_spoofdpi.py
      - name: Verify executables and systemd units on ARM64
        run: |
          test "$(uname -m)" = aarch64
          bin/hysteria version
          bin/spoofdpi --version
          sudo mkdir -p /var/lib/spoofdpi-armada/app /var/lib/hysteria2-armada/app
          sudo install -m755 bin/spoofdpi /var/lib/spoofdpi-armada/app/spoofdpi
          sudo install -m755 bin/hysteria /var/lib/hysteria2-armada/app/hysteria
          systemd-analyze verify configs/spoofdpi-armada.service configs/hysteria2-armada.service
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-arm64
          path: |
            bin/hysteria
            bin/spoofdpi
            HYSTERIA_LICENSE.md
            SPOOFDPI_LICENSE
          if-no-files-found: error
  package:
    needs: [source, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontend
      - uses: actions/download-artifact@v4
        with:
          name: runtime-arm64
      - name: Package and verify Decky ZIP
        run: |
          python scripts/package.py
          cd release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: spoofdpi-armada-v0.3.0-release
          path: release/*
          if-no-files-found: error
