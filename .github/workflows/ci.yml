name: CI
on:
  push:
    branches: [main, feature/hysteria2-tun]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend, schema, lifecycle and packaging checks
        run: |
          npm run typecheck
          npm run build
          python -m compileall -q vpn backend main.py scripts
          python -m unittest tests.test_vpn -v
          python scripts/validate-project.py
          bash -n scripts/uninstall.sh
      - run: npm audit --omit=dev --audit-level=high
      - name: Frontend dependency notices
        run: |
          mkdir -p build/frontend-licenses
          cp node_modules/@decky/api/LICENSE build/frontend-licenses/decky-api-LICENSE
          cp node_modules/tslib/LICENSE.txt build/frontend-licenses/tslib-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            dist/index.js
            build/frontend-licenses
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream ARM64 executable and license
        run: python scripts/build_hysteria.py
      - name: Verify executable runs on ARM64
        run: |
          test "$(uname -m)" = aarch64
          bin/hysteria version
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-arm64
          path: |
            bin/hysteria
            HYSTERIA_LICENSE.md
          if-no-files-found: error
  package:
    needs: [source, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: frontend
      - uses: actions/download-artifact@v4
        with:
          name: runtime-arm64
      - name: Package and verify Decky ZIP
        run: |
          python scripts/package.py
          cd release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hysteria2-armada-v0.2.0-release
          path: release/*
          if-no-files-found: error
